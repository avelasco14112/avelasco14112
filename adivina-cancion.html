<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adivina la Canción</title>

<style>
body{
background:#0a0a0a;
color:white;
font-family:Arial;
text-align:center;
padding:30px;
}

h1{
color:#00ffd5;
}

button{
padding:12px 20px;
margin:10px;
font-size:18px;
cursor:pointer;
border:none;
border-radius:10px;
}

.opcion{
display:block;
margin:10px auto;
width:250px;
}

#resultado{
font-size:24px;
margin-top:20px;
}

#puntos{
font-size:22px;
color:#00ffd5;
}
</style>
</head>
<body>

<h1>🎵 ADIVINA LA CANCIÓN 🎵</h1>

<p id="puntos">Puntos: 0</p>

<audio id="audio" controls>
<source src="cancion1.mp3" type="audio/mpeg">
</audio>

<br>

<button onclick="nuevaCancion()">🔀 Nueva Canción</button>

<h2>¿Qué canción está sonando?</h2>

<button class="opcion" onclick="comprobar(1)">Canción 1</button>
<button class="opcion" onclick="comprobar(2)">Canción 2</button>
<button class="opcion" onclick="comprobar(3)">Canción 3</button>

<div id="resultado"></div>

<script>

let correcta = 1;
let puntos = 0;

function nuevaCancion(){

correcta = Math.floor(Math.random()*3)+1;

document.getElementById("resultado").innerHTML="";

if(correcta==1){
document.getElementById("audio").src="cancion1.mp3";
}

if(correcta==2){
document.getElementById("audio").src="cancion2.mp3";
}

if(correcta==3){
document.getElementById("audio").src="cancion3.mp3";
}

document.getElementById("audio").play();

}

function comprobar(num){

if(num===correcta){

puntos++;

document.getElementById("resultado").innerHTML="✅ ¡Correcto!";

}else{

document.getElementById("resultado").innerHTML="❌ Incorrecto";

}

document.getElementById("puntos").innerHTML="Puntos: "+puntos;

}

</script>

</body>
</html>
