<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avelasco Gaming</title>
<link rel="stylesheet" href="style.css">

<style>
/* BUSCADOR */
#searchBox {
    width: 90%;
    padding: 10px;
    margin: 10px;
    font-size: 16px;
}

/* CONTADOR */
.counter {
    text-align: center;
    margin: 15px;
    font-size: 18px;
    color: #fff;
}
</style>

</head>
<body>

<header>
    <h1>🎮 AVELASCO</h1>
</header>

<!-- 🔥 CONTADOR DE VISITAS -->
<div class="counter">
👁️ Visitas a la web: <span id="visitas">0</span>
</div>

<!-- 🔎 BUSCADOR -->
<input type="text" id="searchBox" onkeyup="buscarVideos()" placeholder="🔎 Buscar vídeos...">

<!-- MENÚ -->
<div class="menu">
    <a href="#directos">🔴 Directos</a>
    <a href="#gameplays">🎮 Gameplays</a>
</div>


</div>

<!-- 🔥 BUSCADOR SCRIPT -->
<script>
function buscarVideos() {
    let input = document.getElementById("searchBox").value.toLowerCase();
    let videos = document.querySelectorAll(".videos a");

    videos.forEach(video => {
        let texto = video.textContent.toLowerCase();
        if (texto.includes(input)) {
            video.style.display = "block";
        } else {
            video.style.display = "none";
        }
    });
}
</script>

<!-- 👁️ CONTADOR DE VISITAS (simple con localStorage) -->
<script>
let visitas = localStorage.getItem("visitas");

if (!visitas) {
    visitas = 1;
} else {
    visitas = parseInt(visitas) + 1;
}

localStorage.setItem("visitas", visitas);
document.getElementById("visitas").innerText = visitas;
</script>

</body>
</html>
